<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="hs-block hidden">
          <p id="hs-new-record" class="hs-new-record hidden"></p>
          <form id="hs-entry" class="hs-entry hidden" autocomplete="off">
            <input id="hs-name" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
            <button type="submit" id="hs-save-btn" class="hs-btn">Guardar</button>
          </form>
          <table class="hs-table" id="gameover-hs-table"></table>
          <p class="hs-stats" id="gameover-hs-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" class="menu-btn" id="resume-btn">Reanudar</button>
        <button type="button" class="menu-btn" id="menu-restart-btn">Reiniciar</button>
        <button type="button" class="menu-btn menu-btn-secondary" id="controls-toggle-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="start-level" for="start-level-select">
          Nivel inicial
          <select id="start-level-select">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
        <p class="start-level-hint">Se aplica al reiniciar o en la próxima partida</p>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">RÉCORDS</p>
        <div class="hs-block">
          <table class="hs-table" id="start-hs-table"></table>
          <p class="hs-stats" id="start-hs-stats"></p>
        </div>
        <button id="play-btn" class="hs-btn hs-btn-primary">Jugar</button>
        <button id="clear-hs-btn" class="hs-btn hs-btn-danger">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
